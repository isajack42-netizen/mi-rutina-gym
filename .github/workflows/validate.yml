name: LiftEngine Validation

on:
  push:
    branches: [ main, "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js sw.js js/*.js; do
            node --check "$file"
          done

      - name: Static application validation
        run: node scripts/validate.mjs

      - name: Regression suite
        run: node scripts/regression.mjs

      - name: Reliability and recovery scenarios
        run: node scripts/reliability.mjs

      - name: Training friction audit
        run: node scripts/friction.mjs

      - name: Personal Edition final audit
        run: node scripts/final-audit.mjs

      - name: Exercise Library foundation audit
        run: node scripts/exercise-library-audit.mjs
