name: Package LiftEngine v6.0.1

on:
  push:
    branches: [ "package-v6.0.1" ]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact v6.0.1 main commit
        uses: actions/checkout@v4
        with:
          ref: 81464d779afec7296d1599cc3a870d09584bb9cc
          path: LiftEngine-v6.0.1

      - name: Verify version
        shell: bash
        run: |
          grep -F "LIFTENGINE_VERSION = '6.0.1'" LiftEngine-v6.0.1/js/version.js

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: LiftEngine-v6.0.1
          path: LiftEngine-v6.0.1
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
